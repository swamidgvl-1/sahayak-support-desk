<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're offline</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#faf7f4;color:#2b2118;font-family:system-ui,sans-serif;text-align:center;padding:24px}
  h1{font-size:1.4rem;margin:.5rem 0}p{color:#7a6a5c;margin:.25rem 0 1.25rem}
  button{background:#7c4a2d;color:#fff;border:0;border-radius:10px;padding:12px 20px;font-size:1rem}
  @media (prefers-color-scheme:dark){body{background:#1a1310;color:#f1e8df}p{color:#a89686}button{background:#c98a5b;color:#1c120c}}
</style>
</head>
<body>
  <main>
    <div style="font-size:3rem">📡</div>
    <h1>You're offline</h1>
    <p>Check your internet connection. Your tickets will be here when you're back.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
